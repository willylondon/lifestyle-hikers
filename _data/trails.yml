  - name: Cockpit Country Guided Hike
    featured: false
    bookable: false
    slug: cockpit-country-guided-hike
    parish: Trelawny / St. James / St. Elizabeth
    location: Cockpit Country, western Jamaica
    summary: Guided day hikes enter Jamaica's rugged cockpit-karst interior through communities such as Windsor, Albert Town, Flagstaff, and Accompong, combining forest, caves, biodiversity, and Maroon heritage.
    difficulty: hard
    distance: Varies by community route
    elevation: Repeated steep karst hills
    time: 3 hrs to full day
    duration_minutes_min: 180
    duration_minutes_max: 480
    route_type: not_recorded
    trail_status: caution
    verification_level: protected_area_confirmed
    source_checked_date: 2026-07-31
    guide_requirement: required
    river_crossing: false
    trailhead: Use only a trailhead supplied by a recognised community guide or conservation partner.
    access_note: Cockpit Country is a protected, rugged and often inaccessible landscape, not one single marked trail. Select a named community route and confirm permission and guide arrangements.
    parking: Varies by community and must be arranged with the guide.
    footwear: Sturdy hiking boots with strong grip.
    equipment:
      - At least 2 litres of water
      - Long trousers and insect protection
      - Headlamp for any approved cave component
      - Offline navigation carried by the guide
    known_hazards:
      - Complex navigation and limited mobile coverage
      - Steep wet limestone terrain
      - Caves, sinkholes and fragile habitat
      - Heat, insects and remote access
    preparation_note: Never enter the interior unguided; choose a specific community-operated route and follow all protected-area instructions.
    source_label: Windsor Research Centre — Cockpit Country
    source_url: https://wrc.cockpitcountry.com/
