    slug: island-gully-falls
    parish: St. Ann
    location: White River Valley, near Ocho Rios, St. Ann
    summary: Follow streamside forest paths through a ticketed waterfall property known for vivid mineral pools, cascades, swimming areas, and plantation ruins.
    difficulty: moderate
    distance: Varies by guided route
