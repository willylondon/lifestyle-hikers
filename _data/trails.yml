  - name: Serge Island Forest Reserve Trail
    featured: false
    bookable: false
    slug: serge-island-forest-reserve
    parish: St. Thomas
    location: Hillside and Trinityville, St. Thomas
    summary: A rugged cross-country forest route beginning near Reggae Falls, crossing the Johnson River, and climbing into the 707-hectare Serge Island Forest Reserve.
    difficulty: hard
    distance: 12 km event route
    distance_km: 12
    elevation: Not published
    time: Full-day trek
    duration_minutes_min: 300
    duration_minutes_max: 480
    route_type: not_recorded
    trail_status: caution
    verification_level: event_route_confirmed
    source_checked_date: 2026-07-31
    guide_requirement: required
    river_crossing: true
    trailhead: Hillside Square near Reggae Falls, St. Thomas, for the published Forest Trek route.
    access_note: The Forestry Department confirms this as its March 2026 Forest Trek route, rated 7/10. Registration is closed and routine independent public access is not established; contact Forestry before visiting.
    parking: Use only arrangements confirmed by the Forestry Department or an authorised local guide.
    footwear: Sturdy hiking footwear with aggressive grip and secure river-crossing capability.
    equipment:
      - At least 2 litres of water
      - Sun and rain protection
      - Personal first-aid essentials
    known_hazards:
      - Rugged steep terrain
      - Johnson River crossing
      - Heat exposure and limited services
      - Hurricane-affected forest sections
    preparation_note: Do not treat the published event route as an always-open self-guided trail; obtain current access and guide confirmation from Forestry.
    guide_url: /blog/serge-island-to-reggae-falls-st-thomas-jamaica-hike/
    source_label: Forestry Department — Forest Trek 2026
