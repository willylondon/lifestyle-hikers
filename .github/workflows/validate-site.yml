name: Validate site

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.6"
      - run: gem install bundler -v 4.0.4 --no-document
      - run: bundle install
      - run: ruby scripts/validate_content.rb
      - run: JEKYLL_ENV=production bundle exec jekyll build
