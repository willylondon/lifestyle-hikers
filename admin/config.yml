# ============================================
# Decap CMS Configuration — Lifestyle Hikers
# ============================================
# Docs: https://decapcms.org/docs/

backend:
  name: github
  repo: willylondon/lifestyle-hikers
  branch: main
  app_id: Iv1.b81c2fe99d3dc7f7

# Where uploaded images are stored
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

# Slug formatting
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# ============================================
# COLLECTIONS
# ============================================

collections:

  # ------------------------------------------
  # 0. SITE STATISTICS (_config.yml)
  # ------------------------------------------
  - name: "settings"
    label: "⚙️ Site Settings"
    description: "Manage website baseline statistics and settings"
    files:
      - name: "stats"
        label: "Homepage Counters"
        file: "_config.yml"
        fields:
          - label: "Statistics"
            name: "stats"
            widget: "object"
            fields:
              - label: "Baseline Total Hikes"
                name: "base_total_hikes"
                widget: "number"
                value_type: "int"
                min: 0
                hint: "The base number to add to the dynamic calculation of total hikes."
              - label: "Baseline Hikes This Year"
                name: "base_hikes_this_year"
                widget: "number"
                value_type: "int"
                min: 0
                hint: "The base number to add to the dynamic calculation of hikes this year."
              - label: "Active Members"
                name: "active_members"
                widget: "number"
                value_type: "int"
                min: 0
                hint: "The number of active members to display on the homepage."
              - label: "Trails Explored"
                name: "trails_explored"
                widget: "number"
                value_type: "int"
                min: 0
                hint: "The number of trails explored to display on the homepage."

  # ------------------------------------------
  # 1. BLOG POSTS (_posts folder)
  # ------------------------------------------
  - name: "posts"
    label: "📝 Blog Posts"
    label_singular: "Blog Post"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    sort: "date:desc"
    summary: "{{title}} — {{date | date('MMM D, YYYY')}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "The headline for your blog post"

      - label: "Slug"
        name: "slug"
        widget: "string"
        hint: "Used for the filename and default blog URL. Example: blue-mountain-peak-hike"

      - label: "SEO Description"
        name: "description"
        widget: "text"
        required: false
        hint: "1-2 short sentences (about 140-160 characters) for Google search snippets."

      - label: "Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"

      - label: "Author"
        name: "author"
        widget: "string"
        default: "Lifestyle Hikers"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Trail Stories"
          - "Trail Guides"
          - "Hike Recaps"
          - "Trail Tips"
          - "Gear Reviews"
          - "Community News"
        default: "Trail Stories"

      - label: "Location"
        name: "location"
        widget: "string"
        required: false
        hint: "e.g. Blue Mountain Peak, Portland"

      - label: "Featured Image"
        name: "image"
        widget: "image"
        required: false
        hint: "Upload or paste an image URL"

      - label: "Distribution Status"
        name: "distribution_status"
        widget: "select"
        required: false
        default: "draft"
        hint: "Set to Ready only when this blog should be announced to Telegram."
        options:
          - label: "Draft"
            value: "draft"
          - label: "Ready"
            value: "ready"
          - label: "Sent"
            value: "sent"
          - label: "Failed"
            value: "failed"

      - label: "Announcement ID"
        name: "announcement_id"
        widget: "string"
        required: false
        hint: "Optional stable ID for duplicate protection. Leave blank to generate from the post slug."

      - label: "Send to Telegram"
        name: "send_to_telegram"
        widget: "boolean"
        required: false
        default: true

      - label: "Send to Brevo"
        name: "send_to_brevo"
        widget: "boolean"
        required: false
        default: false
        hint: "Leave off for blog posts unless a blog email workflow is intentionally configured."

      - label: "Announcement Sent At"
        name: "announcement_sent_at"
        widget: "datetime"
        required: false
        hint: "Optional automation bookkeeping field."

      - label: "Telegram Sent"
        name: "telegram_sent"
        widget: "boolean"
        required: false
        default: false

      - label: "Brevo Sent"
        name: "brevo_sent"
        widget: "boolean"
        required: false
        default: false

      - label: "Telegram Message ID"
        name: "telegram_message_id"
        widget: "string"
        required: false

      - label: "Brevo Message ID"
        name: "brevo_message_id"
        widget: "string"
        required: false

      - label: "Announcement Error"
        name: "announcement_error"
        widget: "text"
        required: false
        hint: "Safe error summary only. Do not paste secrets."

      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        hint: "Add one keyword phrase per item (e.g. 'hiking in jamaica')."

      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Write your post here! Use headings, bold, lists, and images."

  # ------------------------------------------
  # 2. HIKES & EVENTS (_data/events.yml)
  # ------------------------------------------
  - name: "events"
    label: "🥾 Hikes & Events"
    description: "Add upcoming hikes or record hikes that already happened"
    files:
      - name: "upcoming_hikes"
        label: "Hike Schedule"
        file: "_data/events.yml"
        fields:
          - label: "Hikes"
            name: "items"
            widget: "list"
            label_singular: "Hike"
            summary: "{{fields.name}} — {{fields.date | date('MMM D, YYYY')}} — {{fields.event_status}}"
            add_to_top: true
            collapsed: true
            hint: "Use Add Hike above this list. New hikes open at the top, and the public site sorts them by date automatically. Past dates are welcome."
            fields:
              - label: "Hike Name"
                name: "name"
                widget: "string"
                hint: "e.g. Blue Mountain Peak Sunrise Hike"

              - label: "Location"
                name: "location"
                widget: "string"
                hint: "e.g. Penlyne Castle, Portland"

              - label: "Difficulty"
                name: "difficulty"
                widget: "select"
                options:
                  - label: "Easy"
                    value: "easy"
                  - label: "Moderate"
                    value: "moderate"
                  - label: "Hard"
                    value: "hard"

              - label: "Hike Date"
                name: "date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
                picker_utc: true
                hint: "Choose the actual hike date, even if it has already passed. Past dates are published as completed automatically."

              - label: "Time & Meeting Point"
                name: "time"
                widget: "string"
                required: false
                hint: "Optional for past hikes. Example: 2:00 AM — Meet at Whitfield Hall"

              - label: "Distance"
                name: "distance"
                widget: "string"
                required: false
                hint: "Optional. Example: 7.5 mi round trip"

              - label: "Spots Available"
                name: "spots"
                widget: "number"
                value_type: "int"
                min: 0
                required: false
                hint: "Optional for completed hikes. This is a manually managed display number, not live booking inventory."

              - label: "Event Status"
                name: "event_status"
                widget: "select"
                required: false
                default: "auto"
                hint: "Recommended: Automatic. Future dates show as upcoming and past dates show as completed. Choose another status only for a special case."
                options:
                  - label: "Automatic — use the hike date"
                    value: "auto"
                  - label: "Upcoming"
                    value: "upcoming"
                  - label: "Sold out"
                    value: "sold_out"
                  - label: "Members only"
                    value: "members_only"
                  - label: "Cancelled"
                    value: "cancelled"
                  - label: "Completed"
                    value: "completed"

              - label: "Capacity"
                name: "capacity"
                widget: "number"
                value_type: "int"
                min: 0
                required: false
                hint: "CMS-managed capacity only. This is not connected to live bookings."

              - label: "Price (JMD)"
                name: "price_jmd"
                widget: "number"
                value_type: "int"
                min: 0
                required: false

              - label: "Meeting Point"
                name: "meeting_point"
                widget: "string"
                required: false
                hint: "Keep the legacy Time & Meeting Point field for old records."

              - label: "Departure Time"
                name: "departure_time"
                widget: "string"
                required: false

              - label: "Transport Information"
                name: "transport_information"
                widget: "text"
                required: false

              - label: "Booking Deadline"
                name: "booking_deadline"
                widget: "datetime"
                required: false

              - label: "Payment Methods"
                name: "payment_methods"
                widget: "select"
                multiple: true
                required: false
                options:
                  - label: "Bank transfer"
                    value: "bank_transfer"
                  - label: "Cash"
                    value: "cash"
                  - label: "Local transfer"
                    value: "local_transfer"
                  - label: "Manual confirmation"
                    value: "manual_confirmation"

              - label: "Waitlist Link"
                name: "waitlist_url"
                widget: "string"
                required: false

              - label: "Description"
                name: "description"
                widget: "text"
                required: false
                hint: "Optional for a quick past-hike entry. Add a short recap or what hikers can expect."

              - label: "Flyer Image"
                name: "flyer"
                widget: "image"
                required: false
                hint: "Optional flyer used for Telegram and Brevo announcements."

              - label: "Registration Link"
                name: "registration_url"
                widget: "string"
                required: false
                hint: "Signup link, WhatsApp link, Google Form link, or hike detail page."

              - label: "Distribution Status"
                name: "distribution_status"
                widget: "select"
                required: false
                default: "draft"
                hint: "Set to Ready only when this hike should be announced."
                options:
                  - label: "Draft"
                    value: "draft"
                  - label: "Ready"
                    value: "ready"
                  - label: "Sent"
                    value: "sent"
                  - label: "Failed"
                    value: "failed"

              - label: "Announcement ID"
                name: "announcement_id"
                widget: "string"
                required: false
                hint: "Optional stable ID for duplicate protection. Leave blank to generate from the hike name and date."

              - label: "Send to Telegram"
                name: "send_to_telegram"
                widget: "boolean"
                required: false
                default: true

              - label: "Send to Brevo"
                name: "send_to_brevo"
                widget: "boolean"
                required: false
                default: true

              - label: "Announcement Sent At"
                name: "announcement_sent_at"
                widget: "datetime"
                required: false
                hint: "Optional automation bookkeeping field."

              - label: "Telegram Sent"
                name: "telegram_sent"
                widget: "boolean"
                required: false
                default: false

              - label: "Brevo Sent"
                name: "brevo_sent"
                widget: "boolean"
                required: false
                default: false

              - label: "Telegram Message ID"
                name: "telegram_message_id"
                widget: "string"
                required: false

              - label: "Brevo Message ID"
                name: "brevo_message_id"
                widget: "string"
                required: false

              - label: "Announcement Error"
                name: "announcement_error"
                widget: "text"
                required: false
                hint: "Safe error summary only. Do not paste secrets."

  # ------------------------------------------
  # 3. GALLERY (_data/gallery.yml)
  # ------------------------------------------
  - name: "gallery"
    label: "📸 Gallery"
    description: "Manage the photo gallery on the homepage"
    files:
      - name: "gallery_photos"
        label: "Gallery Photos"
        file: "_data/gallery.yml"
        fields:
          - label: "Photos"
            name: "items"
            widget: "list"
            label_singular: "Photo"
            summary: "{{fields.alt}}"
            fields:
              - label: "Image"
                name: "image"
                widget: "image"
                hint: "Upload a photo or paste a URL"

              - label: "Caption / Alt Text"
                name: "alt"
                widget: "string"
                hint: "Describe what's in the photo"

              - label: "Size (Layout)"
                name: "size"
                widget: "select"
                required: false
                default: ""
                hint: "Leave as Regular for most photos. Use Tall or Wide for feature photos."
                options:
                  - label: "Regular"
                    value: ""
                  - label: "Tall (spans 2 rows)"
                    value: "tall"
                  - label: "Wide (spans 2 columns)"
                    value: "wide"

  # ------------------------------------------
  # 4. TRAILS (_data/trails.yml)
  # ------------------------------------------
  - name: "trails"
    label: "🗺️ Trails"
    description: "Manage the featured trails shown on the homepage"
    files:
      - name: "featured_trails"
        label: "Featured Trails"
        file: "_data/trails.yml"
        fields:
          - label: "Trails"
            name: "items"
            widget: "list"
            label_singular: "Trail"
            summary: "{{fields.name}} — {{fields.difficulty | upper}}"
            fields:
              - label: "Trail Name"
                name: "name"
                widget: "string"
                hint: "e.g. Blue Mountain Peak Trail"

              - label: "Stable Slug"
                name: "slug"
                widget: "string"
                required: false
                hint: "Lowercase URL key, for example blue-mountain-peak. Do not change an established slug without a redirect."

              - label: "Feature on Homepage"
                name: "featured"
                widget: "boolean"
                required: false
                default: false
                hint: "Keep this selective so the homepage trail section stays uncluttered. All trails still appear in Trail Explorer."

              - label: "Available for Lifestyle Hikers Booking"
                name: "bookable"
                widget: "boolean"
                required: false
                default: false
                hint: "Turn on only when Lifestyle Hikers has confirmed it can safely accept bookings for this route."

              - label: "Trail Summary"
                name: "summary"
                widget: "text"
                required: false
                hint: "A concise, factual description of what hikers can expect."

              - label: "Parish"
                name: "parish"
                widget: "string"
                required: false
                hint: "Primary parish, or multiple parishes where the route crosses a boundary."

              - label: "Location / Parish"
                name: "location"
                widget: "string"
                hint: "e.g. Portland / St. Thomas"

              - label: "Difficulty"
                name: "difficulty"
                widget: "select"
                options:
                  - label: "Easy"
                    value: "easy"
                  - label: "Moderate"
                    value: "moderate"
                  - label: "Hard"
                    value: "hard"

              - label: "Distance"
                name: "distance"
                widget: "string"
                hint: "e.g. 7.5 mi"

              - label: "Distance (kilometres)"
                name: "distance_km"
                widget: "number"
                value_type: "float"
                min: 0
                required: false
                hint: "Metric value used by Trail Explorer filters. Keep the legacy Distance field for old records."

              - label: "Elevation Gain"
                name: "elevation"
                widget: "string"
                hint: "e.g. 3,200 ft"

              - label: "Duration"
                name: "time"
                widget: "string"
                hint: "e.g. 6-8 hrs"

              - label: "Minimum Duration (minutes)"
                name: "duration_minutes_min"
                widget: "number"
                value_type: "int"
                min: 0
                required: false

              - label: "Maximum Duration (minutes)"
                name: "duration_minutes_max"
                widget: "number"
                value_type: "int"
                min: 0
                required: false

              - label: "Route Type"
                name: "route_type"
                widget: "select"
                required: false
                default: "not_recorded"
                options:
                  - label: "Not recorded"
                    value: "not_recorded"
                  - label: "Out and back"
                    value: "out_and_back"
                  - label: "Loop"
                    value: "loop"
                  - label: "Point to point"
                    value: "point_to_point"

              - label: "Trail Status"
                name: "trail_status"
                widget: "select"
                required: false
                default: "not_verified"
                options:
                  - label: "Not verified"
                    value: "not_verified"
                  - label: "Open"
                    value: "open"
                  - label: "Use caution"
                    value: "caution"
                  - label: "Closed"
                    value: "closed"

              - label: "Last Verified Date"
                name: "last_verified_date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
                required: false

              - label: "Verification Level"
                name: "verification_level"
                widget: "string"
                required: false
                hint: "For example source_confirmed or event_route_confirmed. Do not use field_verified without a recent on-the-ground check."

              - label: "Online Source Checked Date"
                name: "source_checked_date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
                required: false
                hint: "Date the linked source was checked. This is not a field-condition verification date."

              - label: "River Crossing"
                name: "river_crossing"
                widget: "boolean"
                required: false
                default: false

              - label: "Guide Requirement"
                name: "guide_requirement"
                widget: "select"
                required: false
                default: "not_recorded"
                options:
                  - label: "Not recorded"
                    value: "not_recorded"
                  - label: "Not required"
                    value: "not_required"
                  - label: "Recommended"
                    value: "recommended"
                  - label: "Required"
                    value: "required"

              - label: "Preparation Note"
                name: "preparation_note"
                widget: "text"
                required: false
                hint: "Short practical preparation guidance. Do not claim real-time safety."

              - label: "Trailhead"
                name: "trailhead"
                widget: "text"
                required: false

              - label: "Access Note"
                name: "access_note"
                widget: "text"
                required: false
                hint: "Record permissions, ticketing, opening, guide, or unconfirmed-access limitations."

              - label: "Parking"
                name: "parking"
                widget: "text"
                required: false

              - label: "Footwear"
                name: "footwear"
                widget: "text"
                required: false

              - label: "Equipment"
                name: "equipment"
                widget: "list"
                required: false
                field:
                  label: "Item"
                  name: "item"
                  widget: "string"

              - label: "Known Hazards"
                name: "known_hazards"
                widget: "list"
                required: false
                field:
                  label: "Hazard"
                  name: "hazard"
                  widget: "string"

              - label: "Research Source Label"
                name: "source_label"
                widget: "string"
                required: false

              - label: "Research Source URL"
                name: "source_url"
                widget: "string"
                required: false
                hint: "Prefer an official operator, tourism authority, Forestry Department, or conservation manager."

              - label: "Official Access or Booking URL"
                name: "booking_url"
                widget: "string"
                required: false

              - label: "Existing Trail Guide URL"
                name: "guide_url"
                widget: "string"
                required: false
                hint: "Link to an existing long-form guide or story."

              - label: "Rating"
                name: "rating"
                widget: "number"
                value_type: "float"
                min: 0
                max: 5
                step: 0.1
                hint: "e.g. 4.9"

              - label: "Star Icons (full stars)"
                name: "stars"
                widget: "number"
                value_type: "int"
                min: 0
                max: 5
                hint: "Number of full star icons to show (e.g. 5)"

              - label: "Show Half Star?"
                name: "half_star"
                widget: "boolean"
                default: false
                hint: "Show a half-star after the full stars?"

              - label: "Number of Reviews"
                name: "reviews"
                widget: "number"
                value_type: "int"
                min: 0
                hint: "e.g. 312"

              - label: "Trail Photo"
                name: "image"
                widget: "image"
                hint: "Upload or paste a URL for the trail card image"

              - label: "Representative Image Only"
                name: "image_is_representative"
                widget: "boolean"
                required: false
                default: false
                hint: "Turn on when the image represents the region or terrain but is not the named trail."

              - label: "Photo Caption"
                name: "image_caption"
                widget: "text"
                required: false

              - label: "Photo Credit"
                name: "image_credit"
                widget: "string"
                required: false

              - label: "Photo Credit URL"
                name: "image_credit_url"
                widget: "string"
                required: false

              - label: "Photo Licence"
                name: "image_license"
                widget: "string"
                required: false

              - label: "Photo Alt Text"
                name: "alt"
                widget: "string"
                hint: "Describe the trail photo for accessibility"

  # ------------------------------------------
  # 5. REVIEWS / TESTIMONIALS (_data/testimonials.yml)
  # ------------------------------------------
  - name: "testimonials"
    label: "⭐ Reviews"
    description: "Manage the community and corporate testimonials shown on the homepage"
    files:
      - name: "reviews_list"
        label: "Reviews List"
        file: "_data/testimonials.yml"
        fields:
          - label: "Reviews"
            name: "items"
            widget: "list"
            label_singular: "Review"
            summary: "{{fields.name}} — {{fields.text}}"
            fields:
              - label: "Author Name"
                name: "name"
                widget: "string"
                hint: "e.g. Sarah Jenkins"
                
              - label: "Handle / Title"
                name: "handle"
                widget: "string"
                hint: "e.g. Weekend Hiker, or @sarahj_hikes"

              - label: "Avatar Image"
                name: "avatar"
                widget: "image"
                required: false
                hint: "Upload a photo of the reviewer (optional)"

              - label: "Star Rating"
                name: "rating"
                widget: "number"
                value_type: "int"
                min: 1
                max: 5
                required: false
                hint: "Provide a star rating from 1 to 5 (optional)"

              - label: "Review Text"
                name: "text"
                widget: "text"
                hint: "The actual testimonial or quote"
